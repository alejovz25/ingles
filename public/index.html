  <!-- Full-Screen Lightbox Modal for Inspecting Poster, Photos, or Videos -->
  <div id="lightbox-modal" onclick="closeLightbox(event)" class="no-print fixed inset-0 z-50 hidden bg-black/85 backdrop-blur-xs flex items-center justify-center p-4 sm:p-6">
    <div class="relative max-w-4xl w-full flex flex-col items-center">
      <div class="w-full flex items-center justify-between text-white mb-3 px-1">
        <p id="lightbox-caption" class="text-xs sm:text-sm font-semibold text-slate-200 truncate pr-4"></p>
        <button type="button" onclick="forceCloseLightbox()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25 text-white text-xs font-semibold transition cursor-pointer shrink-0">
          <span>Close</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div id="lightbox-media-wrapper" class="w-full flex items-center justify-center">
        <img id="lightbox-img" src="" alt="Expanded view" class="max-h-[82vh] w-auto rounded-xl shadow-2xl border border-white/15 object-contain bg-white">
      </div>
    </div>
  </div>

  <!-- Server Storage & Real-Time Synchronization Script -->
  <script>
    let sharedGalleryItems = [];
    let sharedComments = [];
    let targetSlotIndex = null;

    const DEFAULT_CAPTIONS = [
      'Opening match at the UdeA synthetic field.',
      'Arañita, Smirnoff, and Águilas in action.',
      'Teamwork and student camaraderie on campus.'
    ];

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = String(text ?? '');
      return div.innerHTML;
    }

    function showGalleryBanner(message, isError = false) {
      const banner = document.getElementById('gallery-status-banner');
      const textEl = document.getElementById('gallery-status-text');
      if (!banner || !textEl) return;
      textEl.textContent = message;
      banner.classList.remove('hidden', 'bg-udea-light', 'text-udea-dark', 'border-udea-green/25', 'bg-red-50', 'text-red-700', 'border-red-200');
      if (isError) {
        banner.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
      } else {
        banner.classList.add('bg-udea-light', 'text-udea-dark', 'border-udea-green/25');
      }
    }

    function hideGalleryBanner() {
      const banner = document.getElementById('gallery-status-banner');
      if (banner) banner.classList.add('hidden');
    }

    // Lightbox Functions
    function openLightbox(src, caption, kind = 'image') {
      const modal = document.getElementById('lightbox-modal');
      const wrapper = document.getElementById('lightbox-media-wrapper');
      const captionEl = document.getElementById('lightbox-caption');
      captionEl.textContent = caption || 'Tournament Visual';

      if (kind === 'video' || kind === true) {
        wrapper.innerHTML = `<video src="${escapeHtml(src)}" controls autoplay playsinline class="max-h-[82vh] w-auto rounded-xl shadow-2xl border border-white/15 bg-black"></video>`;
      } else {
        wrapper.innerHTML = `<img src="${escapeHtml(src)}" alt="Expanded view" class="max-h-[82vh] w-auto rounded-xl shadow-2xl border border-white/15 object-contain bg-white">`;
      }

      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function forceCloseLightbox() {
      const modal = document.getElementById('lightbox-modal');
      const wrapper = document.getElementById('lightbox-media-wrapper');
      modal.classList.add('hidden');
      wrapper.innerHTML = '';
      document.body.style.overflow = '';
    }

    function closeLightbox(event) {
      if (event.target.id === 'lightbox-modal') {
        forceCloseLightbox();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') forceCloseLightbox();
    });

    // Audio / Vocaroo UI & Server Sync
    function toggleAudioEditor() {
      document.getElementById('audio-editor-panel').classList.toggle('hidden');
    }

    function renderVocarooState(vocarooUrl) {
      const placeholder = document.getElementById('audio-default-placeholder');
      const activeBox = document.getElementById('audio-active-container');
      const statusText = document.getElementById('audio-status-text');
      const input = document.getElementById('vocaroo-input');

      if (!vocarooUrl) {
        placeholder.classList.remove('hidden');
        activeBox.classList.add('hidden');
        statusText.textContent = 'Space reserved for the article audio recording — Add your Vocaroo link here';
        return;
      }

      if (input && document.activeElement !== input) {
        input.value = vocarooUrl;
      }

      const match = vocarooUrl.match(/(?:voca\.ro|vocaroo\.com)\/([a-zA-Z0-9]+)/);
      placeholder.classList.add('hidden');
      activeBox.classList.remove('hidden');

      if (match && match[1]) {
        const vocId = match[1];
        activeBox.innerHTML = `
          <div class="flex flex-col gap-2">
            <iframe width="100%" height="60" src="https://vocaroo.com/embed/${vocId}?autoplay=0" frameborder="0" allow="autoplay" class="rounded-lg"></iframe>
            <div class="flex items-center justify-between text-xs text-slate-500">
              <span>Vocaroo Audio • Shared with all visitors</span>
              <a href="${escapeHtml(vocarooUrl)}" target="_blank" rel="noopener noreferrer" class="text-udea-green font-semibold hover:underline">Open on Vocaroo &rarr;</a>
            </div>
          </div>
        `;
      } else {
        activeBox.innerHTML = `
          <div class="flex items-center justify-between gap-3">
            <span class="text-xs sm:text-sm font-semibold text-slate-800 truncate">${escapeHtml(vocarooUrl)}</span>
            <a href="${escapeHtml(vocarooUrl)}" target="_blank" rel="noopener noreferrer" class="px-3.5 py-2 rounded-lg bg-udea-green text-white text-xs font-semibold hover:bg-udea-dark transition shrink-0">Listen to Audio</a>
          </div>
        `;
      }
      statusText.textContent = 'Article audio recording attached and visible to everyone';
    }

    async function applyVocarooLink() {
      const input = document.getElementById('vocaroo-input');
      const feedback = document.getElementById('audio-feedback');
      const rawUrl = input.value.trim();
      if (!rawUrl) return;

      renderVocarooState(rawUrl);
      try {
        await fetch('/api/meta', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ vocarooUrl: rawUrl })
        });
        feedback.textContent = 'Vocaroo link saved for all devices.';
        feedback.classList.remove('hidden');
      } catch (err) {
        feedback.textContent = 'Could not save link right now.';
        feedback.classList.remove('hidden');
      }
    }

    // Organizer Interview Server Sync
    async function saveOrganizerFields(showToast = false) {
      const nameVal = document.getElementById('organizer-name').value.trim();
      const opinionVal = document.getElementById('organizer-opinion').value.trim();
      const statusEl = document.getElementById('organizer-sync-status');

      try {
        await fetch('/api/meta', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ organizerName: nameVal, organizerOpinion: opinionVal })
        });
        if (showToast && statusEl) {
          statusEl.textContent = 'Saved & Visible to Everyone!';
          setTimeout(() => {
            statusEl.textContent = 'Shared Interview Space';
          }, 2500);
        }
      } catch (err) {}
    }

    // Gallery Rendering & Direct File Uploads
    function triggerSlotPicker(slotIdx) {
      targetSlotIndex = slotIdx;
      document.getElementById('single-media-input').click();
    }

    function renderGallery() {
      const grid = document.getElementById('shared-media-grid');
      if (!grid) return;

      const sorted = [...sharedGalleryItems].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      const cards = [];

      sorted.forEach((item, idx) => {
        cards.push({ empty: false, item, idx });
      });

      while (cards.length < 3) {
        const slotIdx = cards.length;
        cards.push({
          empty: true,
          slotIdx,
          caption: DEFAULT_CAPTIONS[slotIdx] || 'Event photo or video'
        });
      }

      grid.innerHTML = cards.map((card, displayIdx) => {
        if (card.empty) {
          return `
            <figure class="group relative rounded-2xl border-2 border-dashed border-slate-300 bg-slate-50/80 hover:border-udea-green/60 hover:bg-udea-light/20 transition overflow-hidden flex flex-col">
              <div onclick="triggerSlotPicker(${card.slotIdx})" class="aspect-[4/3] w-full flex flex-col items-center justify-center p-6 text-center cursor-pointer relative">
                <div class="w-12 h-12 rounded-full bg-white text-udea-green shadow-2xs border border-slate-200 flex items-center justify-center mb-3 group-hover:scale-105 transition">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 4v16m8-8H4"/>
                  </svg>
                </div>
                <span class="text-sm font-bold text-slate-700">Photo or Video ${displayIdx + 1}</span>
                <span class="text-xs text-slate-400 mt-1">Click to upload photo or video</span>
              </div>
              <figcaption class="px-4 py-2.5 bg-white border-t border-slate-200/80 text-xs text-slate-500 font-medium">
                ${escapeHtml(card.caption)}
              </figcaption>
            </figure>
          `;
        }

        const { item } = card;
        const safeCaption = escapeHtml(item.caption || `Event Highlight ${displayIdx + 1}`);
        const safeSrc = escapeHtml(item.src);
        const kind = item.kind || 'image';

        const mediaHtml = kind === 'video'
          ? `<video src="${safeSrc}" controls playsinline class="w-full h-full object-cover"></video>`
          : `<img src="${safeSrc}" alt="${safeCaption}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://placehold.co/600x450/e8f5ee/026937?text=UdeA+Softball+Event';">`;

        return `
          <figure class="group relative rounded-2xl border border-slate-200 bg-white shadow-2xs overflow-hidden flex flex-col">
            <div class="aspect-[4/3] w-full bg-slate-900 relative overflow-hidden">
              ${mediaHtml}
              <div class="no-print absolute top-2.5 right-2.5 flex items-center gap-1.5 opacity-95 sm:opacity-0 sm:group-hover:opacity-100 transition">
                <button type="button" onclick="openLightbox('${safeSrc.replace(/'/g, "\\'")}', '${safeCaption.replace(/'/g, "\\'")}', '${kind}')" class="px-2.5 py-1 rounded-lg bg-udea-green text-white text-[11px] font-semibold shadow cursor-pointer">
                  Expand
                </button>
                <button type="button" onclick="deleteGalleryItem('${item.id}')" class="px-2 py-1 rounded-lg bg-red-600 text-white text-[11px] font-semibold shadow cursor-pointer" title="Delete">
                  &times;
                </button>
              </div>
            </div>
            <figcaption class="px-3.5 py-2.5 bg-white border-t border-slate-200/80 flex items-center gap-2">
              <input 
                type="text" 
                value="${safeCaption}" 
                onchange="updateGalleryCaption('${item.id}', this.value)"
                aria-label="Media caption"
                class="w-full text-xs text-slate-700 font-medium bg-transparent border-b border-transparent focus:border-udea-green focus:outline-none py-0.5"
              >
            </figcaption>
          </figure>
        `;
      }).join('');
    }

    async function uploadFilesToServer(files, captionOverride) {
      if (!files || files.length === 0) return;
      showGalleryBanner(`Uploading ${files.length} file(s)... please wait.`);

      const formData = new FormData();
      for (const file of files) {
        formData.append('media', file);
      }
      if (captionOverride) {
        formData.append('caption', captionOverride);
      }

      try {
        const res = await fetch('/api/gallery/upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (data.ok) {
          sharedGalleryItems = data.gallery;
          renderGallery();
          showGalleryBanner('Published! Your photo/video is now saved and visible to all visitors.');
        } else {
          showGalleryBanner('Upload failed. Please verify the file format.', true);
        }
      } catch (err) {
        showGalleryBanner('Connection error while uploading file.', true);
      }
    }

    async function handleSingleMediaUpload(event) {
      const files = Array.from(event.target.files);
      const defaultCap = targetSlotIndex !== null && DEFAULT_CAPTIONS[targetSlotIndex]
        ? DEFAULT_CAPTIONS[targetSlotIndex]
        : '';
      await uploadFilesToServer(files, defaultCap);
      event.target.value = '';
    }

    async function handleMediaFileUpload(event) {
      const files = Array.from(event.target.files);
      await uploadFilesToServer(files, '');
      event.target.value = '';
    }

    async function updateGalleryCaption(docId, newCaption) {
      try {
        await fetch(`/api/gallery/${encodeURIComponent(docId)}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ caption: newCaption })
        });
      } catch (err) {}
    }

    async function deleteGalleryItem(docId) {
      try {
        await fetch(`/api/gallery/${encodeURIComponent(docId)}`, {
          method: 'DELETE'
        });
        sharedGalleryItems = sharedGalleryItems.filter((item) => item.id !== docId);
        renderGallery();
      } catch (err) {}
    }

    // Spectator Comments Rendering & Server Submission
    function renderComments() {
      const list = document.getElementById('spectator-comments-list');
      const badge = document.getElementById('comments-count-badge');
      if (!list) return;

      const displayList = [...sharedComments].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      if (badge) badge.textContent = displayList.length;

      list.innerHTML = displayList.map((item) => {
        const initials = (item.name || 'S')
          .split(' ')
          .filter(Boolean)
          .slice(0, 2)
          .map((part) => part[0].toUpperCase())
          .join('') || 'S';

        return `
          <div class="rounded-xl bg-slate-50 border border-slate-200/80 p-3.5 space-y-2">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-8 h-8 rounded-full bg-udea-green text-white text-xs font-bold flex items-center justify-center shrink-0">
                  ${escapeHtml(initials)}
                </div>
                <div class="min-w-0">
                  <p class="text-xs font-bold text-slate-900 truncate">${escapeHtml(item.name)}</p>
                  <span class="inline-block text-[10px] font-semibold text-udea-green bg-udea-light px-2 py-0.5 rounded-md">
                    ${escapeHtml(item.team)}
                  </span>
                </div>
              </div>
              <span class="text-[10px] text-slate-400 shrink-0">${escapeHtml(item.date)}</span>
            </div>
            <p class="text-xs text-slate-700 leading-relaxed break-words">${escapeHtml(item.message)}</p>
          </div>
        `;
      }).join('');
    }

    async function addSpectatorComment(event) {
      event.preventDefault();
      const nameInput = document.getElementById('spectator-name');
      const teamInput = document.getElementById('spectator-team');
      const msgInput = document.getElementById('spectator-message');

      const name = nameInput.value.trim();
      const team = teamInput.value;
      const message = msgInput.value.trim();
      if (!name || !message) return;

      try {
        const res = await fetch('/api/comments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, team, message })
        });
        const data = await res.json();
        if (data.ok) {
          sharedComments = data.comments;
          renderComments();
          nameInput.value = '';
          msgInput.value = '';
        }
      } catch (err) {}
    }

    // Load initial data from server & refresh periodically so new uploads/comments appear automatically
    async function syncFromServer() {
      try {
        const res = await fetch('/api/state');
        const state = await res.json();

        if (Array.isArray(state.gallery)) {
          sharedGalleryItems = state.gallery;
          renderGallery();
        }
        if (Array.isArray(state.comments)) {
          sharedComments = state.comments;
          renderComments();
        }
        if (state.meta) {
          if (state.meta.vocarooUrl) {
            renderVocarooState(state.meta.vocarooUrl);
          }
          const orgNameEl = document.getElementById('organizer-name');
          const orgOpEl = document.getElementById('organizer-opinion');
          if (orgNameEl && document.activeElement !== orgNameEl && typeof state.meta.organizerName === 'string') {
            orgNameEl.value = state.meta.organizerName;
          }
          if (orgOpEl && document.activeElement !== orgOpEl && typeof state.meta.organizerOpinion === 'string') {
            orgOpEl.value = state.meta.organizerOpinion;
          }
        }
      } catch (err) {}
    }

    syncFromServer();
    setInterval(syncFromServer, 8000);
  </script>
